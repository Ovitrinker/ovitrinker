name: Update Profile SVGs

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate SVGs
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || github.token }}
        run: python scripts/generate.py
      - name: Commit and push assets
        run: |
          git config user.name "Ovitrinker"
          git config user.email "257288350+Ovitrinker@users.noreply.github.com"
          git add assets/
          git diff --staged --quiet || (git commit -m "chore: update profile widgets" && git push)
